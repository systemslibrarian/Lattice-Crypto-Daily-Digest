[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice-crypto-daily-digest"
version = "0.4.1"
description = "Daily retrieval, filtering, ranking, deduplication, and Chinese digest generation for lattice cryptography papers."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2",
    "PyYAML>=6",
    "requests>=2",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "invoke>=2",
  "mypy>=1.8",
  "types-PyYAML",
  "types-requests",
  "vcrpy>=6",
]
# Extras needed to build the public GitHub Pages website from the digests.
site = [
  "markdown>=3.5",
]
# Optional semantic-embedding backend for novelty scoring. Off by default; the
# hashing embedder keeps the core dependency-free and offline. Enable with
# LATTICE_EMBEDDING_BACKEND=sentence-transformers once installed.
embeddings = [
  "sentence-transformers>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

# mypy is applied as a *ratchet*: only the modules listed in `files` are
# type-checked (under --strict), and the list grows as modules are annotated.
# This keeps the CI type gate green and meaningful instead of drowning in
# pre-existing untyped-code noise. To extend coverage, make a module pass
# `mypy --strict src/lattice_digest/<module>.py` and add it to `files`.
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_unused_configs = true
ignore_missing_imports = true
files = [
  "src/lattice_digest/models.py",
  "src/lattice_digest/text.py",
  "src/lattice_digest/dedup.py",
  "src/lattice_digest/venue_registry.py",
  "src/lattice_digest/radar_freshness.py",
  "src/lattice_digest/artifact_paths.py",
  "src/lattice_digest/ranking_explainability.py",
  "src/lattice_digest/recommendation_calibration.py",
  "src/lattice_digest/source_health_ledger.py",
  "src/lattice_digest/library_taxonomy.py",
  "src/lattice_digest/novelty.py",
  "src/lattice_digest/embedding_store.py",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest_tmp"
norecursedirs = [
  ".git",
  ".venv",
  "venv",
  "env",
  "build",
  "dist",
  "site-packages",
  "Lib",
  "Scripts",
  "exports",
  "audits",
  ".pytest_tmp",
  "__pycache__",
]
